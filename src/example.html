<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="/scripts/example.js"></script>
    <link type="text/css" rel="stylesheet" href="/css/example.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        #toggleControls {
            position: fixed;
            top: 16px;
            left: 16px;
            z-index: 10001;
            padding: 10px 14px;
            border: 0;
            border-radius: 6px;
            background: #005fb8;
            color: #fff;
            cursor: pointer;
        }

        #toggleContent {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 10001;
            padding: 10px 14px;
            border: 0;
            border-radius: 6px;
            background: #005fb8;
            color: #fff;
            cursor: pointer;
        }

        .drawer-left {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 20vw;
            height: 50vh;
            background: #fff;
            box-shadow: 2px 0 12px rgba(0,0,0,0.2);
            transform: translateX(-100%);
            transition: transform 0.5s ease;
            z-index: 10000;
        }

        .drawer-left.open {
            transform: translateX(0);
        }

        .drawer-right {
            position: fixed;
            bottom: 0;
            right: 0;
            width: 75vw;
            height: 90vh;
            background: #fff;
            box-shadow: -2px 0 12px rgba(0,0,0,0.2);
            transform: translateX(100%);
            transition: transform 0.5s ease;
            z-index: 10000;
        }

        .drawer-right.open {
            transform: translateX(0);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: 0;
        }

        .content {
            padding: 80px 24px 24px;
        }

        .actions, .events, .subscriptions {
            margin-bottom: 32px;
        }

        .action, .event, .subscription {
            margin-bottom: 20px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        textarea, input, select, button {
            margin-top: 8px;
        }

        .phone-link {
            color: blue;
            text-decoration: underline;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <button id="toggleControls">Open / Close Controls</button>
    <button id="toggleContent">Open / Close Content</button>

    <div class="drawer-left" id="controlsDrawer">
        <iframe 
            id="softphone"
            allow="camera *; microphone *"
            src="https://apps.mypurecloud.de/crm/embeddableFramework.html">
        </iframe>
    </div>

    <div class="drawer-right" id="contentDrawer">
        <iframe 
            id="interactionFrame"
            src="https://apps.mypurecloud.de/crm/interaction.html">
        </iframe>
    </div>

    <div class='content'>
        <h1>PureCloud Embeddable Framework Example</h1>

        <div class="actions">
            <h3>Actions</h3>

            <div class="action">
                <h4 class="actionName">Click-to-Dial</h4>
                <p>
                    You can raise events from the main application to automatically place a call using the embedded client.
                    <a href="#" id="clickToDial" class="phone-link">(+34) 604-804-440</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        const controlsBtn = document.getElementById('toggleControls');
        const contentBtn = document.getElementById('toggleContent');

        const controlsDrawer = document.getElementById('controlsDrawer');
        const contentDrawer = document.getElementById('contentDrawer');

        const softphoneFrame = document.getElementById('softphone');
        const clickToDialLink = document.getElementById('clickToDial');

        controlsBtn.addEventListener('click', () => {
            controlsDrawer.classList.toggle('open');
        });

        contentBtn.addEventListener('click', () => {
            contentDrawer.classList.toggle('open');
        });

        function sendClickToDial() {
            softphoneFrame.contentWindow.postMessage(
                JSON.stringify({
                    type: 'clickToDial',
                    data: '+34604804440'
                }),
                '*'
            );
        }

        softphoneFrame.addEventListener('load', () => {
            clickToDialLink.addEventListener('click', function (e) {
                e.preventDefault();
                sendClickToDial();
            });
        });
    </script>

</body>
</html>
